name: Deploy Marp slides to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show files before build
        run: ls -la

      - name: Build PDFs and HTML with Marp CLI
        run: |
          npx --yes @marp-team/marp-cli@latest Typography.md --pdf --allow-local-files --output public/Typography.pdf
          npx --yes @marp-team/marp-cli@latest Typography.md --html --allow-local-files --output public/Typography.html
          npx --yes @marp-team/marp-cli@latest Composition.md --pdf --allow-local-files --output public/Composition.pdf
          npx --yes @marp-team/marp-cli@latest Composition.md --html --allow-local-files --output public/Composition.html
          npx --yes @marp-team/marp-cli@latest Color.md --pdf --allow-local-files --output public/Color.pdf
          npx --yes @marp-team/marp-cli@latest Color.md --html --allow-local-files --output public/Color.html

      - name: Copy index.html to public
        run: |
          ls -la
          find . -maxdepth 1 -iname "index.html" -exec cp -v {} public/index.html \;

      - name: Show public folder
        run: ls -la public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
